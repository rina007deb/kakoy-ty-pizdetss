<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Какой ты пиздец?</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#351b08;background:linear-gradient(#f7c55d,#c97716)}.wrap{max-width:760px;margin:auto;padding:14px}.sign,.card{background:#fff0bf;border:4px solid #54270a;border-radius:14px;box-shadow:7px 7px 0 #7d3e0d}.sign{text-align:center;padding:18px;margin-bottom:18px}.sign div:first-child{font-size:48px}.sign h1{font-size:clamp(38px,9vw,68px);line-height:.9;margin:5px 0;text-transform:lowercase}.sign b{font-size:14px}.card{padding:20px;margin-bottom:16px}.q{font-size:24px;font-weight:900;line-height:1.12;margin:12px 0 18px}.progress{text-align:right;font-weight:900;font-size:13px}.bar{height:18px;background:#54270a;border-radius:20px;padding:3px}.bar i{display:block;height:100%;background:#ffd978;border-radius:20px}.answers{display:grid;gap:12px}button{font:inherit;font-weight:900;border:3px solid #54270a;border-radius:10px;padding:15px;background:#ffd978;color:#351b08;box-shadow:4px 4px 0 #7d3e0d;cursor:pointer;text-align:left}button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #7d3e0d}.center{text-align:center}.result h2{font-size:clamp(38px,10vw,66px);line-height:.95;margin:12px 0}.result p{font-size:20px;font-weight:800;line-height:1.35}.tiny{text-align:center;font-size:12px;font-weight:700;opacity:.7}
</style></head><body><div class="wrap"><div class="sign"><div>🍺💩🍺</div><h1>какой ты пиздец ?</h1><b>тест, который не просили, но который тебе придётся пройти</b></div><main id="app"></main></div>
<script>
const Q=[
["тебе предлагают пойти погулять, что ты сделаешь ?",["соглашусь ! обожаю прогулки с друзьямм. можно будет зайти в кофейню))))","спрошу, пойдем ли мы пить пиво"]],
["ты проснулся утром субботы. тебе почти никуда не нужно. действия ?",["мое утро не начнется без кофе! 🥰","охуеть. нужено опохмелиться"]],
["твои друзья решили сходить все вместе в «питькофе». ты ?",["конечно я с вами !","ебать с кем я дружила до этой минуты"]],
["капучино или латте ?",["американо😈","ель"]],
["у тебя бессонница. почему ?",["наверное, я выпила слишком много кофе…. 😵‍💫","мало выпила пива"]],
["у тебя повышено давление и сильная тревожность. что будешь делать ?",["перейду на зеленый чай, буду пить больше воды и сейчас же запишусь к врачу !","это обычное утро. брошу пить пиво на 47 минут"]],
["тебя приглашают гулять по заброшенному кладбищу. твои действия?",["боже, никогда.","надо затариться в кб перед отъездом. там его не будет…."]],
["ты просишь своего партнера помыться наконец, но он отказывается. твои действия?",["у меня такого не было и не будет.","отберу у него пиво, пока не помоет твою тушу ебаную."]],
["тебя зовут на шашлыки. что берёшь?",["ничего, там же всё организуют","🍺 и ещё 🍺 на всякий случай"]],
["твой друг пишет: «есть тема»",["что случилось?","я уже выхожу. 🍺 брать?"]],
["ты пришёл(а) в гости, а там нет 🍺",["ничего страшного, попью воды","а зачем тогда вообще было приходить?"]],
["на улице прекрасная погода. твои действия?",["остаюсь дома, посмотрю фильм","пишу друзьям: 🍺?"]],
["тебе предлагают вместо 🍺 выпить чай",["ну ладно, чай тоже неплохо","ты сейчас серьёзно?"]],
["ты случайно оказался(ась) в лесу",["поищу дорогу домой","интересно, где ближайший КБ"]],
["твой друг говорит: «давай сегодня без алкоголя»",["хорошо, без проблем","а зачем тогда сегодня?"]],
["ты увидел(а) красивый закат",["какая красота, сфоткаю","не хватает только 🍺"]],
["тебе подарили 500 рублей",["отложу","это судьба. 🍺"]],
["вы с друзьями не знаете, куда пойти",["давайте в парк","давайте туда, где есть 🍺"]],
["ты обнаружил(а), что дома закончился 🍺",["ну и ладно, завтра куплю","ПИЗДЕЦ. ОДЕВАЕМСЯ."]],
["тебе говорят: «сегодня нужно лечь пораньше»",["да, завтра рано вставать","после 🍺 поговорим"]],
["тебя зовут в поход",["возьму удобную обувь, аптечку и воду","а сколько 🍺 помещается в рюкзак?"]],
["ты зашёл(а) в магазин только за хлебом",["куплю хлеб и уйду","почему я вышел(а) с двумя пакетами и 🍺?"]],
["твой идеальный пятничный вечер:",["уютный фильм, плед и спокойный вечер","🍺, друзья и решения, о которых пожалею в понедельник"]],
["тебе предлагают познакомиться с новыми людьми",["немного стесняюсь, но давайте","а они пьют 🍺?"]],
["в компании внезапно стало скучно",["поговорю с кем-нибудь","КТО ИДЁТ ЗА 🍺?"]],
["что важнее всего в жизни?",["здоровье, семья и близкие люди","чтобы 🍺 было холодным"]],
["твой жизненный девиз?",["всё будет хорошо","ну 🍺 и 🍺"]],
["последний вопрос. ты готов(а) узнать результат?",["да, пожалуйста","только если там 🍺"]]
];
function e(s){return s.replace(/пиво/gi,"🍺").replace(/пива/gi,"🍺").replace(/пивом/gi,"🍺").replace(/пиве/gi,"🍺").}
const qs=Q.map(x=>[e(x[0]),x[1].map(e)]);let i=0,n=0;
function start(){i=0;n=0;show()}
function show(){if(i>=qs.length)return result();let q=qs[i],p=Math.round(i/qs.length*100);app.innerHTML='<div class="card"><div class="progress">вопрос '+(i+1)+' из '+qs.length+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="q">'+q[0]+'</div><div class="answers"><button onclick="ans(0)">'+q[1][0]+'</button><button onclick="ans(1)">'+q[1][1]+'</button></div></div><div class="tiny">🍺 пенка теста: '+p+'%</div>'}
function ans(x){if(x===1)n++;i++;show()}
function result(){let t,s;if(n===28){t="АХУЕТЬ";s="ТЫ НАШ(А). 🍺<br>Результат настолько очевиден, что тест дальше проходить бессмысленно."}else if(n>=24){t="ГО ПО ПИВКУ? 🍺";s="Ты прошёл(а) тест не зря.<br>Нам есть о чём поговорить."}else if(n>=19){t="ПОЧТИ ЧЕЛОВЕК 🍺";s="Ещё немного — и можно будет с тобой пить 🍺."}else if(n>=14){t="НЕОПРЕДЕЛИВШИЙСЯ ПИЗДЕЦ";s="Ты одновременно хочешь 🍺 и боишься последствий."}else if(n>=10){t="ТЫ КТО ВООБЩЕ?";s="Результат отказался тебя классифицировать."}else if(n>=6){t="ОПАСНО БЛИЗКО К НОРМАЛЬНОСТИ";s="Ещё пара таких ответов — и мы потеряем тебя."}else if(n>=3){t="СРОЧНО ВЫПЕЙ 🍺";s="Возможно, это ещё можно исправить."}else{t="ОТОЙДИ, ТЫ ВОНЯЕШЬ";s="Пожалуйста, не подходи ближе.<br>Я уже чувствую запах 🍺."}app.innerHTML='<div class="card result center"><div style="font-size:60px">🍺💩🍺</div><b>РЕЗУЛЬТАТ</b><h2>'+t+'</h2><p>'+s+'</p><div class="tiny">вторых ответов: '+n+' из '+qs.length+'<br>ничего никуда не сохраняется</div><button style="width:100%;text-align:center;margin-top:16px" onclick="start()">ПРОЙТИ ЕЩЁ РАЗ 🍺</button></div>'}
app.innerHTML='<div class="card center"><div style="font-size:60px">🍺💩🍺</div><h2>ты уверен(а), что хочешь это узнать?</h2><p>тут будут вопросы. некоторые нормальные. некоторые нет.</p><button style="width:100%;text-align:center" onclick="start()">ДА, Я ГОТОВ(А) К ПИЗДЕЦУ</button></div><div class="tiny">сайт ничего не сохраняет и никуда не отправляет твои ответы.</div>';
</script></body></html>
